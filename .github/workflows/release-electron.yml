name: Release Electron

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-electron-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build-mac-arm64
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check for an already published release
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$DRAFT" = "false" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout
        if: steps.published.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        if: steps.published.outputs.exists != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install uv
        if: steps.published.outputs.exists != 'true'
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        if: steps.published.outputs.exists != 'true'
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release version
        if: steps.published.outputs.exists != 'true'
        run: bun run scripts/verify-release-version.ts "${{ inputs.tag || github.ref_name }}"

      - name: Verify macOS update and recovery
        if: steps.published.outputs.exists != 'true'
        run: |
          bun test ./apps/electron/src/main/__tests__/mac-update-policy.test.ts ./apps/electron/src/main/__tests__/mac-update-archive.test.ts
          bun test ./apps/electron/src/main/__tests__/mac-update-artifact.isolated.ts
          bun test ./apps/electron/src/main/__tests__/auto-update-bundle.isolated.ts
          bun test ./apps/electron/src/main/__tests__/auto-update-signed.isolated.ts
          ZO_TEST_MAC_UPDATER=1 bun test ./apps/electron/src/main/__tests__/mac-update.integration.test.ts

      - name: Checkout pinned Agent Compose CLI source
        if: steps.published.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: chaitin/agent-compose
          ref: 35c1fd5bd43594ac3ae24f8546aa3ea657cc0490 # v2610.2.0
          path: .sandboxes/agent-compose-cli-source

      - name: Setup Go for Agent Compose CLI
        if: steps.published.outputs.exists != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache-dependency-path: .sandboxes/agent-compose-cli-source/go.sum

      - name: Prepare native Agent Compose CLI
        if: steps.published.outputs.exists != 'true'
        working-directory: .sandboxes/agent-compose-cli-source
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -trimpath -tags netgo,osusergo -ldflags '-s -w -X github.com/chaitin/agent-compose/pkg/config.BuildVersion=v2610.2.0' -o agent-compose ./cmd/agent-compose
          echo "CRAFT_AGENT_COMPOSE_BINARY=$PWD/agent-compose" >> "$GITHUB_ENV"

      - name: Verify bundled Agent Compose management
        if: steps.published.outputs.exists != 'true'
        run: |
          bun run compose:prepare
          bun test ./packages/shared/src/agent-compose/management-cli.isolated.ts
          bun test ./packages/shared/src/agent-compose/management-skill.isolated.ts
          bun test ./packages/shared/src/agent-compose/catalog-secrets.isolated.ts
          bun test ./packages/shared/src/agent-compose/remote-mcp.test.ts
          bun test ./packages/shared/src/agent-compose/remote-mcp.isolated.ts

      - name: Build and publish
        if: steps.published.outputs.exists != 'true'
        run: |
          bun run app:package:mac
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          (cd apps/electron/release && shasum -a 256 "Zo-${VERSION}-arm64.dmg" > "Zo-${VERSION}-arm64.dmg.sha256" && shasum -a 256 "Zo-${VERSION}-arm64.zip" > "Zo-${VERSION}-arm64.zip.sha256")
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Zo ${TAG}" --notes-file "apps/electron/resources/release-notes/${TAG#v}.md"
          gh release upload "$TAG" "apps/electron/release/Zo-${VERSION}-arm64.dmg" "apps/electron/release/Zo-${VERSION}-arm64.zip" "apps/electron/release/Zo-${VERSION}-arm64.zip.blockmap" "apps/electron/release/Zo-${VERSION}-arm64.dmg.sha256" "apps/electron/release/Zo-${VERSION}-arm64.zip.sha256" apps/electron/release/latest-mac.yml --clobber
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CRAFT_SKIP_DEV_TOOLS: "1"
          # macOS code signing: base64-encoded Developer ID Application .p12
          CSC_LINK: ${{ secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || '' }}
          # macOS notarization: Apple ID flow
          APPLE_ID: ${{ secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '' }}
          # macOS notarization: App Store Connect API key flow (preferred for CI)
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER || '' }}

  # Set the GitHub Release changelog. The build jobs create the release
  # (using the verified local packaging script); this job synchronizes its body.
  #
  # Notes are sourced in priority order:
  #   1. The curated, bundled note at `apps/electron/resources/release-notes/
  #      <version>.md` (preferred). This is the SAME file the app ships for its
  #      in-product "What's New", so the GitHub Release and the in-app changelog
  #      stay in sync from a single source.
  #   2. Otherwise, an auto-generated changelog from `git log` since the
  #      previous tag (fallback so a release never ships with an empty body).
  release-notes:
    name: release-notes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          NOTES_FILE="apps/electron/resources/release-notes/${TAG#v}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using bundled release notes: ${NOTES_FILE}"
            cp "$NOTES_FILE" RELEASE_NOTES.md
          else
            echo "No ${NOTES_FILE}; generating changelog from commits."
            PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [ -n "$PREV" ]; then
              RANGE="${PREV}..${TAG}"
              HEADER="Changes since ${PREV}"
            else
              RANGE="$TAG"
              HEADER="Changes"
            fi
            {
              echo "## ${HEADER}"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "$RANGE"
              echo
              echo
              echo "_Full history: ${PREV:+https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}}_"
            } > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"
          cat RELEASE_NOTES.md
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file RELEASE_NOTES.md
